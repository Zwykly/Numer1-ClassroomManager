name: Build and publish container images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/app/Dockerfile
            image: numer1-classroommanager-backend
          - name: frontend
            dockerfile: frontend/Dockerfile
            image: numer1-classroommanager-frontend
          - name: backup
            dockerfile: docker/backup/Dockerfile
            image: numer1-classroommanager-backup
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: name
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=sha,format=long

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests from forks cannot push (read-only token), so they only build.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Packages the minimal set of files the VPS needs, so the server never has to
  # clone the whole repository. Download this artifact from the workflow run.
  vps-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package VPS deployment files
        run: |
          cd deploy/vps
          zip -r "$GITHUB_WORKSPACE/vps-bundle.zip" \
            .env.example \
            docker-compose.yml \
            update.sh \
            README.md \
            rclone

      - name: Upload VPS bundle
        uses: actions/upload-artifact@v4
        with:
          name: vps-bundle
          path: vps-bundle.zip
          if-no-files-found: error
